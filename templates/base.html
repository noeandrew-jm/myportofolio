{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ name }} - Portofolio{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=white-20260914">
    <script src="{% static 'js/liquid-glass.js' %}" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="{% url 'main:show_main' %}" class="brand">{{ name }}</a>
            <nav aria-label="Main navigation">
                <a href="{% url 'main:show_main' %}#profile" class="glass-button{% if active_page == 'about' %} active{% endif %}"{% if active_page == 'about' %} aria-current="page"{% endif %}><span class="glass-button__label">About</span></a>
                <a href="{% url 'main:show_achievements' %}" class="glass-button{% if active_page == 'achievements' %} active{% endif %}"{% if active_page == 'achievements' %} aria-current="page"{% endif %}><span class="glass-button__label">Achievements</span></a>
                <a href="{% url 'main:show_experience' %}" class="glass-button{% if active_page == 'experience' %} active{% endif %}"{% if active_page == 'experience' %} aria-current="page"{% endif %}><span class="glass-button__label">Experience</span></a>
            </nav>
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>
</body>
</html>
