{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ name }} - Portofolio{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="{% url 'main:show_main' %}" class="brand">{{ name }}</a>
            <nav aria-label="Main navigation">
                <a href="{% url 'main:show_main' %}#profile"{% if active_page == 'about' %} class="active" aria-current="page"{% endif %}>About</a>
                <a href="{% url 'main:show_achievements' %}"{% if active_page == 'achievements' %} class="active" aria-current="page"{% endif %}>Achievements</a>
                <a href="{% url 'main:show_experience' %}"{% if active_page == 'experience' %} class="active" aria-current="page"{% endif %}>Experience</a>
            </nav>
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>
</body>
</html>
