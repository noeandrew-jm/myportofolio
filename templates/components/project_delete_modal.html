<button type="button" class="button button-danger"
        popovertarget="delete-project-{{ project.id }}" aria-label="Hapus {{ project.title }}">
    Hapus Proyek
</button>
<div id="delete-project-{{ project.id }}" class="project-delete-modal" popover="auto"
     role="dialog" aria-labelledby="delete-project-title-{{ project.id }}">
    <button type="button" class="project-delete-modal__backdrop"
            popovertarget="delete-project-{{ project.id }}" popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus" tabindex="-1"></button>
    <div class="project-delete-modal__content">
        <button type="button" class="project-delete-modal__close"
                popovertarget="delete-project-{{ project.id }}" popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus">&times;</button>
        <h2 id="delete-project-title-{{ project.id }}">Hapus Proyek?</h2>
        <p>Apakah Anda yakin ingin menghapus <strong>{{ project.title }}</strong>?</p>
        <div class="project-delete-modal__actions">
            <button type="button" class="button button-secondary" autofocus
                    popovertarget="delete-project-{{ project.id }}" popovertargetaction="hide">Batal</button>
            <form method="post" action="{% url 'main:delete_project' project.id %}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Ya, Hapus</button>
            </form>
        </div>
    </div>
</div>
