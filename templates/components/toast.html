<div id="toast-component" class="toast-component toast-hidden toast-normal" popover="manual">
    <div class="toast-content" role="status" aria-live="polite" aria-atomic="true">
        <h3 id="toast-title" class="toast-title"></h3>
        <p id="toast-message" class="toast-message"></p>
    </div>
    <button type="button" class="toast-close" aria-label="Tutup notifikasi">&times;</button>
</div>
